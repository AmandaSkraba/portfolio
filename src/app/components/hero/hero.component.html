<section class="hero col-12 text-center" id="top">

    <!-- Shapes -->
    @for (s of shapes; track $index) {
    <app-shape [x]="s.x" [y]="s.y" [size]="s.size" [kind]="s.kind" [color]="pal[s.c]" [magnetic]="s.m" [depth]="s.d"
        [clickKind]="s.clickKind" [originalKind]="s.kind" />
    }

    <!-- Memojis -->
    @for (m of memojis; track $index) {
    <app-memoji class="fade" [x]="m.x" [y]="m.y" [size]="m.size" />
    }

    <div class="col-8 hero-copy text-center">

        <div appText class="non-select mb-5">
            <p class="eyebrow fade">Desenvolvedora Full Stack</p>

            <h1 class="name cl-terra">
                Amanda
                <span class="cl-sage" style="position: relative; top: -25px;">Skraba<span
                        class="cl-rose">.</span></span>

            </h1>
        </div>

        <div class="cta fade non-select">
            <a class="btn primary" href="#projects">Explorar projetos</a>
            <a class="btn" href="#contact">Entrar em contato</a>
        </div>

    </div>
</section>
